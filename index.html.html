<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>بطاقة بيان سنوي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef5ef;font-family:-apple-system,BlinkMacSystemFont,"SF Arabic",Tahoma,Arial,sans-serif;color:#075b35}
.wrap{max-width:900px;margin:auto;padding:14px}
.box{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 18px #0001}
h1{font-size:22px;text-align:center;margin:2px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-weight:700;margin-bottom:6px}
input{width:100%;padding:13px;border:1px solid #a9c0b0;border-radius:11px;font-size:17px;background:#fff}
button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:11px;font-size:16px;font-weight:700;background:#075b35;color:white}
button.alt{background:#e7f0ea;color:#075b35}
.preview{background:#f1f4f1;padding:7px;overflow:auto;text-align:center}
canvas{width:100%;height:auto;display:block;border-radius:10px}
.tip{font-size:13px;line-height:1.7;text-align:center;color:#64756a;margin-top:9px}
@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="box">
<h1>بطاقة «بيان سنوي فوق»</h1>
<div class="grid">
<div><label>الاسم</label><input id="name" type="text" placeholder="اكتب الاسم"></div>
<div><label>التاريخ</label><input id="date" type="date"></div>
</div>
<button id="share">📤 مشاركة / حفظ الصورة</button>
<button id="open" class="alt">🖼️ فتح الصورة للحفظ</button>
<button id="clear" class="alt">مسح</button>
<div class="tip">
في Safari اضغط «مشاركة / حفظ الصورة» ثم اختر «حفظ في الصور». 
وإذا لم تظهر ورقة المشاركة، اضغط «فتح الصورة للحفظ» ثم اضغط مطولًا على الصورة.
</div>
</div>
<div class="box preview"><canvas id="canvas"></canvas></div>
</div>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const nameInput=document.getElementById("name");
const dateInput=document.getElementById("date");

function dateText(v){
 if(!v)return "";
 const p=v.split("-");
 return p[2]+"/"+p[1]+"/"+p[0];
}
function draw(){
 if(!img.naturalWidth)return;
 canvas.width=img.naturalWidth;
 canvas.height=img.naturalHeight;
 ctx.drawImage(img,0,0);
 ctx.fillStyle="#075b35";
 ctx.font="bold 30px Arial,Tahoma,sans-serif";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(nameInput.value.trim(),415,642);
 ctx.fillText(dateText(dateInput.value),1095,642);
}
img.onload=draw;
nameInput.addEventListener("input",draw);
dateInput.addEventListener("input",draw);

function makeBlob(){
 return new Promise(resolve=>canvas.toBlob(resolve,"image/png"));
}

document.getElementById("share").addEventListener("click",async()=>{
 const blob=await makeBlob();
 const file=new File([blob],"بطاقة-بيان-سنوي.png",{type:"image/png"});
 if(navigator.share){
   try{
     if(!navigator.canShare || navigator.canShare({files:[file]})){
       await navigator.share({title:"بطاقة بيان سنوي",files:[file]});
       return;
     }
   }catch(e){
     if(e.name==="AbortError")return;
   }
 }
 openImage(blob);
});

function openImage(blob){
 const url=URL.createObjectURL(blob);
 const w=window.open(url,"_blank");
 if(!w){
   window.location.href=url;
   return;
 }
 setTimeout(()=>URL.revokeObjectURL(url),120000);
}

document.getElementById("open").addEventListener("click",async()=>{
 openImage(await makeBlob());
});

document.getElementById("clear").addEventListener("click",()=>{
 nameInput.value="";
 dateInput.value="";
 draw();
});
</script>
