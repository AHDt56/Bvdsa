<body>
<div class="wrap">
  <div class="box">
    <h2>بطاقة الرعاية الاجتماعية</h2>

    <label for="name">الاسم</label>
    <input id="name" type="text" autocomplete="name" placeholder="اكتب الاسم">

    <label for="date">التاريخ</label>
    <input id="date" type="text" inputmode="numeric" placeholder="مثال: 2026/08/18">

    <div class="buttons">
      <button id="save" type="button">حفظ</button>
      <button id="share" type="button">مشاركة</button>
      <button id="print" type="button">طباعة / PDF</button>
    </div>

    <div id="msg" aria-live="polite"></div>

    <div id="card" class="card">
      <div id="outName" class="field"></div>
      <div id="outDate" class="field"></div>
    </div>

    <div class="note">اكتب البيانات ثم اضغط «حفظ». للمشاركة استخدم زر «مشاركة» أو «طباعة / PDF» إذا كان جهازك لا يدعم مشاركة الملفات.</div>
  </div>
</div>

<script>
(function(){
  const nameEl = document.getElementById('name');
  const dateEl = document.getElementById('date');
  const outName = document.getElementById('outName');
  const outDate = document.getElementById('outDate');
  const msg = document.getElementById('msg');

  function show(t, ok=true){
    msg.textContent=t;
    msg.style.color = ok ? '#0f8057' : '#b3261e';
    setTimeout(()=>{ if(msg.textContent===t) msg.textContent=''; }, 2500);
  }

  function sync(){
    outName.textContent = nameEl.value.trim();
    outDate.textContent = dateEl.value.trim();
  }

  function saveData(){
    sync();
    const data = {name:nameEl.value, date:dateEl.value};
    try {
      localStorage.setItem('social_card_data', JSON.stringify(data));
      show('تم حفظ البيانات ✓');
    } catch(e) {
      show('تم تحديث البطاقة، لكن تعذر الحفظ الدائم.', false);
    }
  }

  function loadData(){
    try {
      const raw = localStorage.getItem('social_card_data');
      if(raw){
        const d = JSON.parse(raw);
        nameEl.value = d.name || '';
        dateEl.value = d.date || '';
      }
    } catch(e) {}
    sync();
  }

  function canvasBlob(){
    return new Promise((resolve,reject)=>{
      const card = document.getElementById('card');
      const rect = card.getBoundingClientRect();
      const scale = Math.max(2, Math.min(4, window.devicePixelRatio || 2));
      const c = document.createElement('canvas');
      c.width = Math.round(rect.width * scale);
      c.height = Math.round(rect.height * scale);
      const ctx = c.getContext('2d');

      const bg = new Image();
      bg.onload = () => {
        ctx.drawImage(bg, 0, 0, c.width, c.height);

        function draw(el){
          const r = el.getBoundingClientRect();
          const x = (r.left - rect.left) * scale;
          const y = (r.top - rect.top) * scale;
          const style = getComputedStyle(el);
          ctx.font = `${style.fontWeight} ${parseFloat(style.fontSize)*scale}px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif`;
          ctx.fillStyle = style.color;
          ctx.textAlign = 'right';
          ctx.textBaseline = 'top';
          ctx.fillText(el.textContent || '', (r.right-rect.left)*scale, y);
        }
        draw(outName); draw(outDate);
        c.toBlob(b=>b ? resolve(b) : reject(new Error('blob')), 'image/png');

  async function share(){
    sync();
    if(!nameEl.value.trim() && !dateEl.value.trim()){
      show('اكتب البيانات أولاً', false); return;
    }
    try {
      const blob = await canvasBlob();
      const file = new File([blob], 'بطاقة-الرعاية-الاجتماعية.png', {type:'image/png'});
      if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
        await navigator.share({title:'بطاقة الرعاية الاجتماعية', files:[file]});
        show('تم فتح المشاركة ✓');
      } else {
        printCard();
      }
    } catch(e) {
      if(e && e.name === 'AbortError') return;
      printCard();
    }
  }

  function printCard(){
    sync();
    window.print();
  }

  document.getElementById('save').addEventListener('click', saveData);
  document.getElementById('share').addEventListener('click', share);
  document.getElementById('print').addEventListener('click', printCard);
  nameEl.addEventListener('input', sync);
  dateEl.addEventListener('input', sync);
  loadData();
})();
</script>
